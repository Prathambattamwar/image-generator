<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuals - Image Search Engine</title>
    
    <link rel="preconnect" href="https://cse.google.com" crossorigin>
    <link rel="preconnect" href="https://www.google.com" crossorigin>
    <link rel="preconnect" href="https://encrypted-tbn0.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cse.google.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        window.__gcse = {
            parsetags: 'explicit',
            initializationCallback: function() {
                google.search.cse.element.render({
                    div: 'hidden-cse',
                    tag: 'search',
                    gname: 'customImageSearch',
                    attributes: {
                        defaultToImageSearch: "true",
                        disableWebSearch: "true"
                    }
                });
            },
            searchCallbacks: {
                image: {
                    ready: function(name, q, promos, results) {
                        return handleGoogleResults(results);
                    }
                },
                web: {
                    ready: function(name, q, promos, results) {
                        return handleGoogleResults(results);
                    }
                }
            }
        };

        function handleGoogleResults(results) {
            const loadingState = document.getElementById('loading-state');
            loadingState.classList.add('hidden');
            loadingState.classList.remove('flex');
            
            // Clear the 8-second failsafe timeout since it was successful
            if (window.searchTimeout) clearTimeout(window.searchTimeout);
            localStorage.setItem('retryCount', '0'); // Reset retries on success
            
            if (!results || results.length === 0) {
                window.showError("We couldn't find any images for this search on your selected sites.");
                return true;
            }

            const images = results.map(res => {
                let imgUrl = '';
                if (res.unescapedUrl) imgUrl = res.unescapedUrl;
                else if (res.originalImageUrl) imgUrl = res.originalImageUrl;
                else if (res.image && res.image.url) imgUrl = res.image.url;
                else if (res.richSnippet && res.richSnippet.cseImage) imgUrl = res.richSnippet.cseImage.src;
                else if (res.pagemap && res.pagemap.cse_image) imgUrl = res.pagemap.cse_image[0].src;
                
                return {
                    url: imgUrl,
                    title: res.titleNoFormatting || res.title || 'Image Result',
                    author: res.visibleUrl || 'Google Search',
                    width: 800,
                    height: 600
                };
            }).filter(img => img.url);

            if (images.length === 0) {
                window.showError("Could not extract image thumbnails from the results.");
            } else {
                window.renderImages(images);
            }
            return true; 
        }

        const engineIDs = [
            '51f78c001d0284c05',
            '15bef143bf9644633',
            '8454339fb70f546cc',
            '141c268497aa443c0',
            '0510da4168de24c6b',
            '21c0a96a3d61045ab',
            '154bfa638b3a0471e',
            '330e6ea160a5a4558',
            '710187d765e324b4d',
            'c008c5b51c3294820'
        ];

        let currentEngineIndex = parseInt(localStorage.getItem('activeEngineIndex')) || 0;
        console.log(`[Tracker] Page loaded using Engine #${currentEngineIndex + 1} (ID: ${engineIDs[currentEngineIndex]})`);

        const gcseScript = document.createElement('script');
        gcseScript.type = 'text/javascript';
        gcseScript.async = true;
        gcseScript.src = `https://cse.google.com/cse.js?cx=${engineIDs[currentEngineIndex]}`;
        document.head.appendChild(gcseScript);
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-slate-950 antialiased p-4">

    <!-- HIDDEN GOOGLE INTERFACE (Kept completely hidden) -->
    <div id="hidden-cse" class="hidden" style="display: none;"></div>

    <!-- App Window -->
    <div class="w-full max-w-md h-[70vh] bg-slate-900 border border-slate-700 rounded-lg shadow-2xl flex flex-col relative overflow-hidden">
        
        <header class="flex justify-between items-center p-3 border-b border-slate-700 bg-slate-800/50">
            <h1 class="text-slate-200 font-medium tracking-wide text-sm">images</h1>
        </header>

        <main class="flex-grow overflow-y-auto p-4 flex flex-col gap-6" id="main-content">
            
            <div id="loading-state" class="hidden flex-col items-center justify-center py-20 flex-grow">
                <svg class="animate-spin h-8 w-8 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="text-slate-400 text-sm animate-pulse">Generating Image...</p>
            </div>
            
            <div id="error-state" class="hidden flex-col items-center justify-center py-10 text-center flex-grow">
                <p class="text-red-400 text-sm font-bold" id="error-message">No images found.</p>
            </div>

            <div id="featured-container" class="hidden"></div>
            <div id="image-grid" class="hidden"></div>
        </main>

        <footer class="p-3 border-t border-slate-700 bg-slate-800/80 backdrop-blur-sm shrink-0">
            <form id="search-form" class="flex items-center gap-2">
                <div class="flex-grow flex items-center bg-slate-900 border border-slate-600 rounded-md overflow-hidden">
                    <span class="pl-3 pr-1 text-slate-400 text-sm font-medium select-none">Search</span>
                    <input type="text" id="search-input" class="w-full p-2 bg-transparent text-white text-sm outline-none" placeholder="Try searching 'cell' or 'heart'..." required autocomplete="off">
                    <button type="submit" class="p-2 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors border-l border-slate-700">
                        Search
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0 cursor-pointer" onclick="window.closeLightbox()">
        <button id="close-lightbox-btn" class="absolute top-4 right-4 text-white hover:text-red-400 p-2 text-4xl">&times;</button>
        <img id="lightbox-modal-img" src="" class="max-w-[95%] max-h-[90vh] object-contain rounded-md shadow-2xl cursor-default" onclick="event.stopPropagation()">
    </div>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const grid = document.getElementById('image-grid');
        const featuredContainer = document.getElementById('featured-container');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const errorMessage = document.getElementById('error-message');
        
        const lightbox = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-modal-img');
        const closeLightboxBtn = document.getElementById('close-lightbox-btn');

        window.openLightbox = function(src) {
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
        };

        window.closeLightbox = function() {
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
            }, 300);
        };

        if (closeLightboxBtn) {
            closeLightboxBtn.addEventListener('click', window.closeLightbox);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            grid.classList.add('hidden');
            featuredContainer.classList.add('hidden');
            errorState.classList.add('hidden');
            
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            
            if (window.searchTimeout) clearTimeout(window.searchTimeout);
            
            // Failsafe: If no results return in 8 seconds, swap engine silently and retry
            window.searchTimeout = setTimeout(() => {
                if (loadingState.classList.contains('flex')) {
                    console.log(`[Tracker] Engine #${currentEngineIndex + 1} timed out or failed! Swapping...`);
                    
                    currentEngineIndex = (currentEngineIndex + 1) % engineIDs.length;
                    localStorage.setItem('activeEngineIndex', currentEngineIndex);
                    
                    console.log(`[Tracker] Swapped to new Engine #${currentEngineIndex + 1}. Reloading page to try again...`);
                    
                    let retries = parseInt(localStorage.getItem('retryCount')) || 0;
                    if (retries >= engineIDs.length) {
                        window.showError("All 10 engines failed! No results could be fetched.");
                        localStorage.setItem('retryCount', '0');
                        return; 
                    }
                    
                    // Save query and silently reload page to try next engine
                    localStorage.setItem('retryCount', retries + 1);
                    localStorage.setItem('autoRetryQuery', query);
                    window.location.reload();
                }
            }, 8000);

            try {
                const element = google.search.cse.element.getElement('customImageSearch');
                if (element) {
                    element.execute(query);
                } 
            } catch (err) {
                console.error(err);
            }
        });

        window.renderImages = function(images) {
            grid.innerHTML = '';
            featuredContainer.innerHTML = '';
            
            if(images.length > 0) {
                const featured = images[0];
                featuredContainer.innerHTML = `<img id="main-featured-img" src="${featured.url}" class="w-full h-48 object-contain bg-slate-800 rounded shadow-md border border-slate-700 cursor-pointer hover:opacity-90 transition-opacity" title="Click to view full screen">`;
                featuredContainer.classList.remove('hidden');

                // Lightbox trigger for the featured image
                document.getElementById('main-featured-img').addEventListener('click', function() {
                    openLightbox(this.src);
                });
            }
            
            if(images.length > 1) {
                grid.className = 'grid grid-cols-3 gap-2 mt-4';
                images.slice(1, 7).forEach(img => {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'aspect-square bg-slate-800 rounded overflow-hidden border border-slate-700 relative group cursor-pointer';
                    
                    const thumbnail = document.createElement('img');
                    thumbnail.src = img.url;
                    thumbnail.alt = img.title;
                    thumbnail.className = 'w-full h-full object-cover group-hover:scale-110 transition-transform duration-300';
                    
                    // Swap logic: Thumbnail click updates the Featured Image
                    imgDiv.addEventListener('click', () => {
                        const featuredElement = document.getElementById('main-featured-img');
                        if (featuredElement) {
                            // Swap their image sources
                            const tempSrc = featuredElement.src;
                            featuredElement.src = thumbnail.src;
                            thumbnail.src = tempSrc;
                        }
                    });

                    imgDiv.appendChild(thumbnail);
                    grid.appendChild(imgDiv);
                });
                grid.classList.remove('hidden');
            }
        }

        window.showError = function(message) {
            errorMessage.textContent = message;
            errorState.classList.remove('hidden');
            errorState.classList.add('flex');
            loadingState.classList.add('hidden');
            loadingState.classList.remove('flex');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const autoQuery = localStorage.getItem('autoRetryQuery');
            if (autoQuery) {
                input.value = autoQuery;
                localStorage.removeItem('autoRetryQuery');
                
                loadingState.classList.remove('hidden');
                loadingState.classList.add('flex');
                
                // Wait slightly for Google script to initialize, then trigger search automatically
                setTimeout(() => {
                    const element = google.search.cse.element.getElement('customImageSearch');
                    if (element) {
                        element.execute(autoQuery);
                    } else {
                        // Fallback trigger if element isn't quite ready
                        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                    }
                }, 800); 
            }
        });
    </script>
</body>
</html>
